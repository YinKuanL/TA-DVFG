name: Validate revised paper compilation

on:
  push:
    branches:
      - claude-review-revision-20260710
    paths:
      - .github/workflows/validate-paper-revision.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude-review-revision-20260710
      - name: Fix supplement source issues
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('paper/source/supplementary.tex')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\\usepackage{balance}\n', '')
          s = s.replace('deployment pattern, not a claim that HGB or MovieLens instantiates that domain. The method does not provide', 'deployment pattern, not a claim that HGB or MovieLens instantiates that domain.\nThe method does not provide')
          s = s.replace('equivalence. Paired tests compare methods or protocol variants under shared', 'equivalence. Paired tests compare methods or protocol variants under shared')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile main paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper/source
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Compile supplement
        uses: xu-cheng/latex-action@v4
        with:
          root_file: supplementary.tex
          working_directory: paper/source
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/source/supplementary.tex
          git commit -m "Fix AAAI supplement compilation" || true
          git push origin HEAD:claude-review-revision-20260710
