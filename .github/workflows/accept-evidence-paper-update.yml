name: Accept evidence paper update

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/accept-evidence-paper-update.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply paper updates
        shell: python
        run: |
          from pathlib import Path
          import re

          main_path = Path('paper/source/main.tex')
          supp_path = Path('paper/source/supplementary.tex')
          checklist_path = Path('paper/source/ReproducibilityChecklist.tex')

          main = main_path.read_text(encoding='utf-8')
          supp = supp_path.read_text(encoding='utf-8')
          checklist = checklist_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing block for {label}')
              return text.replace(old, new, 1)

          # Main abstract: add real-data mechanism boundary without expanding claims.
          old = """exchange raises party-local accuracy by 1.85/2.67 points on ACM/DBLP Hard and
connected-party accuracy by 4.79/7.16 points. On MovieLens, \\method{} reaches
0.7516 AUC with 3.20M transmitted scalars, versus 0.7497 and 10.00M for Full
Mesh. Thus, learned topology is not claimed to be necessary for one centralized
aggregate; its distinct role is party-local or joint deployment. \\method{} is
an inference-stage collaboration mechanism rather than a formal privacy
mechanism or a fully serverless, end-to-end VFGL protocol."""
          new = """exchange raises party-local accuracy by 1.85/2.67 points on ACM/DBLP Hard and
connected-party accuracy by 4.79/7.16 points. The same boundary appears on
MovieLens: disabling only peer exchange changes active AUC by at most 0.00016
but lowers connected-party mean AUC by 0.0085--0.0131. Thus, learned topology is
not claimed to be necessary for one centralized aggregate; its distinct role is
party-local or joint deployment. \\method{} is an inference-stage collaboration
mechanism rather than a formal privacy mechanism or a fully serverless,
end-to-end VFGL protocol."""
          main = replace_once(main, old, new, 'main abstract mechanism boundary')

          # Main MovieLens paragraph: remove stale supplement wording and add mechanism audit.
          old = """Figure~\\ref{fig:movielens-evidence} shows standalone predictor variation and
the AUC--communication trade-off. Best Single reaches 0.7402 AUC with zero communication; seed-level deltas
appear in the supplement.

Table~\\ref{tab:movielens-main} shows that \\method{} reaches 0.7516 ROC-AUC with 3.20M communication,
compared with 0.7497/10.00M for Full Mesh and 0.7510/5.20M for Adaptive
Pairwise. Because the absolute AUC differences are small, the main five-party result is one of Pareto efficiency rather than a large predictive gain:
\\method{} uses 68.0\\% less communication than Full Mesh and 38.5\\% less than
Adaptive Pairwise. In the controlled 15-party Main and Hard stress settings,
\\method{} reaches 0.7516/0.7498 AUC with 5.2/5.0 links, outperforming 105-link
Full Mesh and Adaptive Pairwise with roughly 14 links. When many weak predictors
are present, selective graph construction therefore provides both sparsity and
a predictive benefit.

\\paragraph{Cross-benchmark interpretation.}
In MovieLens-5, topology learning mainly improves Pareto efficiency, whereas
under weak-predictor stress it also improves robustness by filtering harmful
communication."""
          new = """Figure~\\ref{fig:movielens-evidence} shows standalone predictor variation and
the AUC--communication trade-off. Best Single reaches 0.7402 AUC with zero
communication; paired seed-level deltas are included in the submitted package.

Table~\\ref{tab:movielens-main} shows that \\method{} reaches 0.7516 ROC-AUC
with 3.20M communication, compared with 0.7497/10.00M for Full Mesh and
0.7510/5.20M for Adaptive Pairwise. Because the absolute AUC differences are
small, the main five-party result is one of Pareto efficiency rather than a
large predictive gain: \\method{} uses 68.0\\% less communication than Full Mesh
and 38.5\\% less than Adaptive Pairwise.

A same-state MovieLens audit reproduces the HGB mechanism boundary. Disabling
only peer exchange changes active AUC by at most 0.00016 across the five-party,
15-party Main, and 15-party Hard settings, but lowers all-party local mean AUC
by 0.0038--0.0055 and connected-party mean AUC by 0.0085--0.0131. On
MovieLens-15, Greedy-Subset-$q$ matches or slightly exceeds \\method{}'s active
AUC at about 62--64\\% lower communication. Thus active-only MovieLens
collaboration is again largely participant selection, while peer exchange
provides the distinct party-local benefit.

In the controlled 15-party Main and Hard stress settings, \\method{} reaches
0.7516/0.7498 AUC with 5.2/5.0 links, outperforming 105-link Full Mesh and
Adaptive Pairwise with roughly 14 links. When many weak predictors are present,
selective graph construction therefore provides sparsity and active-readout
robustness, while the same-state audit isolates the peer-exchange benefit for
local consumers."""
          main = replace_once(main, old, new, 'main MovieLens mechanism paragraph')

          # Main mechanism paragraph: add cross-benchmark sentence, avoid overclaim.
          old = """Disabling only peer exchange changes active accuracy by at most 0.20 points but
reduces all-party local mean by 1.85/2.67 points and connected-party accuracy
by 4.79/7.16 points. Thus active-only deployment is mainly participant
selection, whereas local or joint deployment is where peer exchange adds a
distinct capability."""
          new = """Disabling only peer exchange changes active accuracy by at most 0.20 points but
reduces all-party local mean by 1.85/2.67 points and connected-party accuracy
by 4.79/7.16 points. The MovieLens same-state audit shows the same pattern with
ROC-AUC: active changes are near zero, while connected-party local mean drops by
0.0085--0.0131 when exchange is disabled. Thus active-only deployment is mainly
participant selection, whereas local or joint deployment is where peer exchange
adds a distinct capability."""
          main = replace_once(main, old, new, 'main mechanism cross-benchmark')

          # Main efficiency paragraph: replace future-work-only pruning text with evaluated result.
          old = """From 5 to 30 parties, candidate evaluations rise from 617 to 41,542 and
topology time from 0.81 to 81.46 seconds while selected graphs stay near five
links, confirming exhaustive scoring as the current bottleneck. Minimum-link
and edge-budget sweeps show that nonempty sparse collaboration emerges without
a minimum quota: with $m=0$, every ACM/DBLP Hard seed selects a nonempty graph
(2.6/3.0 edges on average), with DBLP unchanged and ACM higher in this sweep;
beyond any minimum quota, $B$ remains an upper bound; full results appear in
the supplement."""
          new = """From 5 to 30 parties, candidate evaluations rise from 617 to 41,542 and
topology time from 0.81 to 81.46 seconds while selected graphs stay near five
links, confirming exhaustive scoring as the current bottleneck. We therefore
evaluate a two-stage shortlist that pre-ranks feasible edges by the existing
pairwise utility and reruns whole-graph scoring only on the top-$M$ candidates.
At 20 parties, $M=20$ reduces evaluations by 88.8\\% and gives a $5.2\\times$
speedup while staying within 0.10 accuracy points of exhaustive search; at
30 parties, $M=40$ reduces evaluations by 90.5\\% with an $8.5\\times$ speedup
and a 0.23-point difference. Effective shortlist size remains setting-dependent.
Minimum-link and edge-budget sweeps appear in the supplement."""
          main = replace_once(main, old, new, 'main pruning paragraph')

          # Main limitations: replace obsolete open-pruning future-work statement.
          old = """Sparse deployment communication scales with the selected edge set, but
exhaustive candidate scoring remains the current scalability bottleneck. A
concrete next step is two-stage screening: use a cheap edge-local score to
shortlist the top-$M$ feasible candidates, then apply the existing whole-graph
rerun only to that shortlist. We do not report a pruning result here, so its
accuracy--time trade-off remains an open experiment rather than a claimed
contribution."""
          new = """Sparse deployment communication scales with the selected edge set, but
exhaustive candidate scoring remains the current scalability bottleneck.
Two-stage screening mitigates this cost in supported larger-party settings, but
the effective shortlist size is setting-dependent and does not yet replace
exhaustive scoring as the default selector."""
          main = replace_once(main, old, new, 'main limitations pruning')

          # Supplement overview: add MovieLens mechanism and pruning to evidence hierarchy.
          old = """The mechanism evidence supports an interface-dependent interpretation. Direct
subset selection is a strong lower-cost alternative for active-only
aggregation, while same-state interventions show that peer exchange materially
improves connected parties' local predictions. Learned topology is therefore
not claimed to be universally necessary for aggregation; its distinct role is
in party-local or joint deployment, where the communication graph itself
changes local inference."""
          new = """The mechanism evidence supports an interface-dependent interpretation. Direct
subset selection is a strong lower-cost alternative for active-only
aggregation, while same-state interventions show that peer exchange materially
improves connected parties' local predictions on both HGB and MovieLens.
Learned topology is therefore not claimed to be universally necessary for
aggregation; its distinct role is in party-local or joint deployment, where the
communication graph itself changes local inference."""
          supp = replace_once(supp, old, new, 'supp overview mechanism')

          # Supplement Q listing: mention MovieLens mechanism and pruning.
          old = """The primary evidence for Q1 is the HGB
comparison and nested weak-party scaling; Q2 is addressed by MovieLens; Q3--Q4
by the mechanism and deployment-objective audits; and Q5 by the ACM Hard
five-seed alignment-reference study."""
          new = """The primary evidence for Q1 is the HGB
comparison, nested weak-party scaling, and the shortlist scalability audit; Q2 is
addressed by MovieLens; Q3--Q4 by the HGB/MovieLens mechanism and
deployment-objective audits; and Q5 by the ACM Hard five-seed
alignment-reference study."""
          supp = replace_once(supp, old, new, 'supp evaluation questions')

          # Supplement MovieLens section: add mechanism tables after summary table.
          marker = """\\paragraph{Five-party comparison.}
Table~\\ref{tab:supp-movielens-summary} includes Best Single at zero
communication."""
          insert = r'''
\paragraph{MovieLens mechanism boundary.}
Table~\ref{tab:supp-movielens-exchange} applies the same-state peer-exchange
audit to MovieLens. Condition A is the exact best-validation \method{} state
with $K=1$. Condition C holds the epoch, topology, participant set, degree
vector, reliability vector, prediction snapshot, and active readout fixed, but
sets $K=0$. The primary metric is ROC-AUC.

\begin{table*}[!t]
\centering
\scriptsize
\setlength{\tabcolsep}{3.0pt}
\caption{MovieLens same-state peer-exchange audit. Deltas are condition A
($K=1$) minus condition C (same state, $K=0$). CIs are paired 95\% intervals over
seeds 42--46; all local and connected-party rows have win/tie/loss $5/0/0$.}
\label{tab:supp-movielens-exchange}
\begin{tabular}{llrrrr}
\toprule
Setting & Metric & A mean & C mean & $\Delta$ & 95\% CI \\
\midrule
Five-party & Active AUC & 0.751625 & 0.751462 & +0.000163 & $[-0.000003,0.000329]$ \\
Five-party & All-party local mean & 0.717552 & 0.712051 & +0.005501 & $[0.003310,0.007693]$ \\
Five-party & Connected-party mean & 0.738357 & 0.729901 & +0.008456 & $[0.006638,0.010275]$ \\
Main-15 & Active AUC & 0.751627 & 0.751645 & $-0.000017$ & $[-0.000068,0.000033]$ \\
Main-15 & All-party local mean & 0.678743 & 0.674894 & +0.003849 & $[0.002924,0.004773]$ \\
Main-15 & Connected-party mean & 0.731176 & 0.721241 & +0.009935 & $[0.008377,0.011492]$ \\
Hard-15 & Active AUC & 0.749831 & 0.749760 & +0.000071 & $[-0.000102,0.000243]$ \\
Hard-15 & All-party local mean & 0.669695 & 0.664414 & +0.005281 & $[0.003683,0.006879]$ \\
Hard-15 & Connected-party mean & 0.715783 & 0.702680 & +0.013103 & $[0.010306,0.015900]$ \\
\bottomrule
\end{tabular}
\end{table*}

Active AUC changes are near zero under the same-state intervention, while local
AUC decreases consistently when peer exchange is disabled. The effect is largest
when averaging only the non-isolated parties that actually receive peer messages.
Thus MovieLens reproduces the HGB mechanism boundary: active-only performance is
mostly a participant-selection problem, whereas peer exchange directly changes
party-local predictions.

\begin{table}[!t]
\centering
\scriptsize
\setlength{\tabcolsep}{3.0pt}
\caption{MovieLens-15 active-only selection boundary. Same-cardinality subset
methods use the \method{} participant count but no peer edges. Communication is
mean transmitted inference scalars.}
\label{tab:supp-movielens-selection}
\begin{tabular}{llrr}
\toprule
Setting & Method & Active AUC & Total comm. \\
\midrule
Main & Global Top-$k$ & 0.750335 & 2.00M \\
Main & Top-Reliability-$q$ & 0.750256 & 2.32M \\
Main & Greedy-Subset-$q$ & \textbf{0.752416} & 2.32M \\
Main & \method{} & 0.751627 & 6.48M \\
\midrule
Hard & Global Top-$k$ & 0.747258 & 2.00M \\
Hard & Top-Reliability-$q$ & 0.747138 & 2.40M \\
Hard & Greedy-Subset-$q$ & \textbf{0.749847} & 2.40M \\
Hard & \method{} & 0.749831 & 6.40M \\
\bottomrule
\end{tabular}
\end{table}

On MovieLens-15, Greedy-Subset-$q$ matches or slightly exceeds \method{} in
active AUC while using about 62--64\% less communication. Selection-only methods
perform no peer exchange and therefore should not be credited with a party-local
benefit; their role is to delimit the active-only interface.

'''
          supp = replace_once(supp, marker, insert + marker, 'supp MovieLens mechanism tables')

          # Supplement scalability paragraph and table: replace future-work-only statement and add shortlist table.
          old = """Table~\\ref{tab:supp-scalability} shows that selected graphs remain near five
links from 5 to 30 parties, while candidate evaluations and topology-selection
time grow much faster. Sparse deployment therefore scales differently from the
current selector: exhaustive candidate scoring, rather than deployment
communication, is the principal bottleneck. A concrete mitigation is a
two-stage selector that ranks feasible edges with a cheap edge-local score and
reruns whole-graph consensus only for the top-$M$ shortlist. This is an
algorithmic path, not an evaluated result in the present paper; a pruning
accuracy--time curve is therefore future work."""
          new = """Table~\\ref{tab:supp-scalability} shows that selected graphs remain near five
links from 5 to 30 parties, while candidate evaluations and topology-selection
time grow much faster. Sparse deployment therefore scales differently from the
current selector: exhaustive candidate scoring, rather than deployment
communication, is the principal bottleneck.

We evaluate a two-stage mitigation that ranks feasible edges by the existing
Adaptive Pairwise edge-local utility and reruns the unchanged whole-graph
\\method{} score only on the top-$M$ shortlist. The $M=\\mathrm{all}$ condition
exactly reproduces the exhaustive selector for every party count and seed.
Table~\\ref{tab:supp-pruning-shortlist} reports the shortlist trade-off. Results
are setting-dependent: the supported larger-party settings reduce candidate
evaluations by about 89--90\\% and give 5.2--8.5$\\times$ speedups while staying
within 0.10--0.23 accuracy points of exhaustive search, but more aggressive or
smaller-party shortlists are treated as supplement-only diagnostics."""
          supp = replace_once(supp, old, new, 'supp scalability paragraph')

          marker = """\\begin{table}[!t]
\\centering
\\footnotesize
\\caption{ACM Hard party-count scalability with a fixed 20\\% useful-party ratio.}
\\label{tab:supp-scalability}"""
          pruning_table = r'''
\begin{table}[!t]
\centering
\scriptsize
\setlength{\tabcolsep}{3.0pt}
\caption{Top-$M$ pruning audit on ACM Hard party-count scalability. Accuracy
change is relative to exhaustive search. Speedup and evaluation reduction are
matched within the same rerun environment, so they should not be mixed with
absolute times in Table~\ref{tab:supp-scalability}.}
\label{tab:supp-pruning-shortlist}
\begin{tabular}{rrrrr}
\toprule
Parties & $M$ & Acc. $\Delta$ & Speedup & Eval. reduction \\
\midrule
15 & 5  & +0.0069 & 9.39$\times$ & 94.8\% \\
15 & 10 & +0.0049 & 5.89$\times$ & 89.6\% \\
15 & 20 & +0.0069 & 3.58$\times$ & 79.3\% \\
15 & 40 & +0.0059 & 1.84$\times$ & 58.7\% \\
20 & 20 & +0.0010 & 5.22$\times$ & 88.8\% \\
30 & 40 & $-0.0023$ & 8.46$\times$ & 90.5\% \\
\bottomrule
\end{tabular}
\end{table}

'''
          supp = replace_once(supp, marker, pruning_table + marker, 'supp pruning table')

          # Supplement statistical reporting: include MovieLens mechanism and pruning.
          old = """For
MovieLens, the package contains paired per-seed AUC/communication deltas; the
paper emphasizes the communication--accuracy trade-off rather than a large AUC
margin."""
          new = """For
MovieLens, same-state peer-exchange audits use ROC-AUC. Active AUC changes are
near zero, while all-party and connected-party local mean AUC improve in all
seeds when peer exchange is enabled. The package contains paired per-seed
AUC/communication deltas; the paper emphasizes the communication--accuracy
trade-off and mechanism boundary rather than a large active-AUC margin."""
          supp = replace_once(supp, old, new, 'supp statistical MovieLens')

          old = """The consensus-depth study is interpreted descriptively because predictive
performance remains stable while $K$-hop reachability expands. For nested
weak-party scaling, we emphasize paired mean differences, win/tie/loss counts,
and the widening effect-size trend. With only five seeds, the minimum attainable
two-sided exact Wilcoxon value under five nonzero differences is 0.0625, so
non-significance is not interpreted as evidence against the observed trend."""
          new = """The consensus-depth and pruning studies are interpreted descriptively. For
pruning, $M=\\mathrm{all}$ is a reproduction gate; nontrivial shortlists are used
only when their utility remains close to exhaustive search under matched reruns.
For nested weak-party scaling, we emphasize paired mean differences,
win/tie/loss counts, and the widening effect-size trend. With only five seeds,
the minimum attainable two-sided exact Wilcoxon value under five nonzero
differences is 0.0625, so non-significance is not interpreted as evidence
against the observed trend."""
          supp = replace_once(supp, old, new, 'supp statistical pruning')

          # Supplement reproducibility/code paths: add accept-evidence script.
          old = """Consensus-depth sensitivity is implemented by
\\texttt{experiments/run\_k\_sensitivity.py}; nested weak-party scaling by
\\texttt{experiments/run\_nested\_weak\_scaling.py}. The submitted package
contains raw CSV/JSON outputs, figure scripts, supplementary diagnostics, and a
usage README."""
          new = """Consensus-depth sensitivity is implemented by
\\texttt{experiments/run\_k\_sensitivity.py}; nested weak-party scaling by
\\texttt{experiments/run\_nested\_weak\_scaling.py}. The MovieLens mechanism and
Top-$M$ pruning audits are implemented by
\\texttt{experiments/accept\_evidence\_closure\_20260710.py}. The submitted
package contains raw CSV/JSON outputs, figure scripts, supplementary diagnostics,
and a usage README."""
          supp = replace_once(supp, old, new, 'supp code paths accept evidence')

          # Checklist consistency: if all experimental source is included and failed variants are preserved, answer yes.
          old = """\t\\question{All experimental code used to eliminate or disprove claims is included}{(yes/no/NA)}
\tno"""
          new = """\t\\question{All experimental code used to eliminate or disprove claims is included}{(yes/no/NA)}
\tyes"""
          checklist = replace_once(checklist, old, new, 'checklist 2.8')

          main_path.write_text(main, encoding='utf-8')
          supp_path.write_text(supp, encoding='utf-8')
          checklist_path.write_text(checklist, encoding='utf-8')

      - name: Compile main paper, supplement, and checklist
        shell: bash
        run: |
          set -euxo pipefail
          cd paper/source
          rm -f main.aux main.bbl main.blg main.log supplementary.aux supplementary.bbl supplementary.blg supplementary.log ReproducibilityChecklist.aux ReproducibilityChecklist.log
          pdflatex -interaction=nonstopmode main.tex
          bibtex main
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode supplementary.tex
          pdflatex -interaction=nonstopmode ReproducibilityChecklist.tex

      - name: Reject unresolved references or stale claims
        shell: bash
        run: |
          set -euxo pipefail
          cd paper/source
          ! grep -R "Citation .* undefined" main.log supplementary.log
          ! grep -R "Reference .* undefined" main.log supplementary.log
          ! grep -R "There were undefined" main.log supplementary.log
          ! grep -R "We do not report a pruning result here" main.tex supplementary.tex
          ! grep -R "seed-level deltas appear in the supplement" main.tex supplementary.tex
          grep -R "0.0085--0.0131" main.tex supplementary.tex
          grep -R "88.8" main.tex supplementary.tex
          grep -R "90.5" main.tex supplementary.tex

      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/accept-evidence-paper-update.yml
          git add paper/source/main.tex paper/source/supplementary.tex paper/source/ReproducibilityChecklist.tex .github/workflows/accept-evidence-paper-update.yml
          git commit -m "Integrate accept-evidence experiments into paper" || echo "No changes to commit"
          git push
