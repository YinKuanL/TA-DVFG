name: Build AAAI-27 Code Package

on:
  push:
    branches:
      - submission-code-package-20260711
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: TA-DVFG_AAAI27_Code_Package

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build clean package
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          repo = Path.cwd()
          out = repo / os.environ['PACKAGE_NAME']
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          blocked_dirs = {
              '.git', '.github', '__pycache__', '.pytest_cache', '.mypy_cache',
              '.ruff_cache', '.venv', 'venv', 'env', 'node_modules', 'build',
              'dist', 'data', 'data_hgb', 'data_acm'
          }
          blocked_suffixes = {
              '.pt', '.pth', '.pkl', '.pickle', '.ckpt', '.bin', '.zip', '.7z',
              '.tar', '.gz', '.log', '.aux', '.bbl', '.blg', '.out', '.pyc'
          }
          code_exts = {
              '.py', '.md', '.txt', '.json', '.csv', '.yaml', '.yml', '.toml',
              '.ini', '.cfg', '.sh', '.ps1', '.bat', '.ipynb'
          }
          output_exts = {'.csv', '.json', '.md', '.txt', '.png', '.pdf'}

          def blocked(p: Path) -> bool:
              rel = p.relative_to(repo)
              return any(part in blocked_dirs for part in rel.parts) or p.suffix.lower() in blocked_suffixes

          def copy_file(src: Path, rel: Path) -> None:
              if not src.is_file() or blocked(src):
                  return
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          def copy_tree(src_rel: str, dst_rel: str | None = None, outputs: bool = False) -> None:
              src = repo / src_rel
              if not src.exists():
                  return
              dst_root = Path(dst_rel or src_rel)
              for p in sorted(src.rglob('*')):
                  if not p.is_file() or blocked(p):
                      continue
                  allowed = output_exts if outputs else code_exts
                  if p.suffix.lower() not in allowed:
                      continue
                  if outputs and p.stat().st_size > 5 * 1024 * 1024:
                      continue
                  copy_file(p, dst_root / p.relative_to(src))

          # Existing cleaned package first.
          copy_tree('supplement_experiment_code', '.')

          # Overlay current implementations, including later mechanism-closure work.
          for d in ['main experiment', 'experiments', 'models', 'tests', 'metadata', 'configs', 'docs']:
              copy_tree(d)

          # Keep small result/audit artifacts needed to verify tables and claims.
          for d in ['outputs', 'results']:
              copy_tree(d, f'reported_outputs/{d}', outputs=True)

          # Dependency and repository metadata.
          for name in [
              'requirements.txt', 'requirements-experiments.txt', 'environment.yml',
              'environment.yaml', 'pyproject.toml', 'setup.cfg', 'setup.py',
              'LICENSE', 'LICENSE.md', 'LICENSE.txt'
          ]:
              p = repo / name
              if p.exists():
                  copy_file(p, Path('repository') / name)

          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (out / 'SOURCE_COMMIT.txt').write_text(commit + '\n', encoding='utf-8')

          required = {
              'Core HGB engine': ['main experiment/ta_dvfg_hgb_reliability.py'],
              'HGB cached core': ['experiments/run_cached_core.py', 'experiments/experiment_plan.py'],
              'Selector robustness': [
                  'experiments/run_cached_ablations.py',
                  'experiments/run_cached_minedges_sweep.py',
                  'experiments/run_k_sensitivity.py',
                  'experiments/run_nested_weak_scaling.py'
              ],
              'Deployment analysis': ['experiments/deployment_objective_analysis.py'],
              'Latent alignment': ['experiments/alignment_references.py'],
              'MovieLens': [
                  'experiments/movielens/prepare_movielens.py',
                  'experiments/movielens/run_movielens_tadvfg.py',
                  'experiments/movielens/extended_movielens_suite.py',
                  'experiments/movielens/aggregate_15party.py',
                  'experiments/movielens/plot_movielens_results.py',
                  'models/movielens_parties.py'
              ],
              'Analysis and statistics': [
                  'experiments/final_analysis.py',
                  'experiments/statistical_tests.py',
                  'experiments/final_claims_audit.py',
                  'experiments/config_audit.py'
              ],
              'Tests': ['tests/test_experiment_plan.py', 'tests/test_reviewer_defense.py']
          }

          audit = [
              '# Package Audit', '', f'Source commit: `{commit}`', '',
              '| Component | Status | Paths |', '|---|---|---|'
          ]
          missing = []
          for component, paths in required.items():
              found = [p for p in paths if (out / p).exists()]
              absent = [p for p in paths if not (out / p).exists()]
              missing.extend(absent)
              status = 'PASS' if not absent else ('PARTIAL' if found else 'MISSING')
              shown = '<br>'.join([f'`{p}`' for p in found] + [f'missing: `{p}`' for p in absent])
              audit.append(f'| {component} | {status} | {shown} |')

          closure = sorted({
              p.relative_to(out).as_posix() for p in out.rglob('*') if p.is_file()
              and any(x in p.as_posix().lower() for x in ['round2', 'same_state', 'same-state', 'subset', 'degree_weight'])
          })
          audit += ['', '## Mechanism-closure material', '']
          audit += [f'- `{p}`' for p in closure] if closure else [
              '- No closure-keyword path found; verify same-state exchange, fixed-trajectory, degree-weighting, and subset scripts manually.'
          ]
          audit += [
              '', '## Boundaries', '',
              '- Raw datasets, model checkpoints, and large prediction caches are excluded.',
              '- Exact historical CPU/GPU, RAM, OS, and full package-version metadata remain partial unless separately documented.',
              '- This build performs a syntax check but does not rerun the full benchmark suite.'
          ]
          (out / 'PACKAGE_AUDIT.md').write_text('\n'.join(audit) + '\n', encoding='utf-8')

          readme = f'''# TA-DVFG AAAI-27 Review Code Package

Paper: **Collaboration without Representation Alignment: Sparse Prediction Topology Learning for Vertical Graph Views**

Source commit: `{commit}`

## Scope

This package contains the experiment code, lightweight tests, configuration metadata,
small raw CSV/JSON outputs, and analysis material used for the reported TA-DVFG
results. Raw datasets, large caches, checkpoints, temporary files, and LaTeX build
products are excluded.

TA-DVFG is an inference-stage topology/readout mechanism. It is not a formal privacy
mechanism and is not presented as a fully serverless end-to-end VFGL protocol.

## Layout

- `main experiment/`: core HGB engine.
- `experiments/`: HGB, mechanism, robustness, latent-alignment, and MovieLens runners.
- `models/`: heterogeneous MovieLens predictors.
- `tests/`: lightweight protocol/configuration tests.
- `metadata/`: configuration and provenance files.
- `reported_outputs/`: small result and audit artifacts.
- `PACKAGE_AUDIT.md`: file-presence audit and known boundaries.
- `MANIFEST.json`, `SHA256SUMS`: integrity records.

## Setup

Use Python 3.9+. Install the included dependency file when present:

```bash
pip install -r requirements.txt
```

HGB requires PyTorch Geometric dataset access. MovieLens requires GroupLens
MovieLens 1M under `data/movielens/ml-1m/`.

## Canonical settings

Headline seeds are `42,43,44,45,46`. Audited HGB defaults are `B=15`,
`d_max=2`, `m=5`, `tau=0.001`, `K=1`, self-weight `eta=0.85`, and a
20-epoch topology refresh interval.

## Main commands

```bash
python experiments/run_cached_core.py --datasets ACM DBLP IMDB --seeds 42,43,44,45,46
python experiments/run_cached_ablations.py
python experiments/run_cached_minedges_sweep.py
python experiments/run_k_sensitivity.py
python experiments/run_nested_weak_scaling.py
python experiments/alignment_references.py --dataset ACM --setting hard --seeds 42,43,44,45,46

python experiments/movielens/prepare_movielens.py --data-dir data/movielens
python experiments/movielens/run_movielens_tadvfg.py --data-dir data/movielens/ml-1m --output-dir outputs/movielens --seeds 42,43,44,45,46 --num-parties 5 --setting five --local-epochs 8
python experiments/movielens/run_movielens_tadvfg.py --data-dir data/movielens/ml-1m --output-dir outputs/movielens_main15 --seeds 42,43,44,45,46 --setting main --local-epochs 8
python experiments/movielens/run_movielens_tadvfg.py --data-dir data/movielens/ml-1m --output-dir outputs/movielens_hard15 --seeds 42,43,44,45,46 --setting hard --local-epochs 8

python experiments/final_analysis.py
python experiments/statistical_tests.py
python experiments/config_audit.py
python experiments/final_claims_audit.py
```

## Interpretation boundary

- Direct subset selection is the stronger lightweight choice for active-only aggregation in the audited Hard settings.
- Sparse peer exchange is distinctly justified for party-local or joint deployment.
- MovieLens-5 supports an AUC--communication Pareto claim, not a large predictive-gain claim.
- Controlled weak-party settings are stress constructions, not naturally occurring federations.

## Integrity

Run `sha256sum -c SHA256SUMS`. Review `PACKAGE_AUDIT.md` before submission;
any missing component must remain reflected conservatively in the checklist.
'''
          (out / 'README.md').write_text(readme, encoding='utf-8')

          if not any(p.is_file() for p in out.rglob('LICENSE*')):
              (out / 'LICENSE_STATUS.md').write_text(
                  '# License status\n\nNo license file was present in this repository snapshot. '
                  'Choose and add the intended public-release license before publication.\n',
                  encoding='utf-8'
              )

          check = subprocess.run(['python', '-m', 'compileall', '-q', str(out)], capture_output=True, text=True)
          (out / 'SYNTAX_CHECK.txt').write_text(
              f'return_code={check.returncode}\nstdout:\n{check.stdout}\nstderr:\n{check.stderr}\n', encoding='utf-8'
          )
          if check.returncode:
              raise SystemExit('Python syntax check failed')
          for d in list(out.rglob('__pycache__')):
              shutil.rmtree(d)
          for p in list(out.rglob('*.pyc')):
              p.unlink()

          manifest_files = []
          for p in sorted(out.rglob('*')):
              if p.is_file():
                  manifest_files.append({
                      'path': p.relative_to(out).as_posix(),
                      'size_bytes': p.stat().st_size,
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest()
                  })
          (out / 'MANIFEST.json').write_text(json.dumps({
              'package': out.name,
              'source_commit': commit,
              'missing_required_paths': missing,
              'files': manifest_files
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          sums = []
          for p in sorted(out.rglob('*')):
              if p.is_file() and p.name != 'SHA256SUMS':
                  sums.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out).as_posix()}")
          (out / 'SHA256SUMS').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print(f'Built {out} with {sum(1 for p in out.rglob("*") if p.is_file())} files')
          PY

      - name: Create archives
        shell: bash
        run: |
          zip -r -9 "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
          tar -czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          sha256sum "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}.tar.gz" > ARCHIVE_SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TA-DVFG_AAAI27_Code_Package
          path: |
            TA-DVFG_AAAI27_Code_Package.zip
            TA-DVFG_AAAI27_Code_Package.tar.gz
            ARCHIVE_SHA256SUMS
          if-no-files-found: error
          retention-days: 30
