contribution.''', r'''Exhaustive candidate scoring remains the scalability bottleneck. Two-stage
pairwise prescreening mitigates it at 20 and 30 parties, but the effective
shortlist size is setting-dependent and no nontrivial shortlist met the
main-claim criterion at 15 parties. We therefore do not claim a universally
lossless pruning rule.''', "limitations pruning")

          main = replace_exact(main, r'''Future work should protect
exchanged messages, scale topology search, and further characterize the
performance--interface trade-off between prediction-space peer deployment and
stronger-information latent fusion.''', r'''Future work should protect
exchanged messages, develop adaptive screening rules, and further characterize
the performance--interface trade-off between prediction-space peer deployment
and stronger-information latent fusion.''', "conclusion future work")

          main_path.write_text(main, encoding="utf-8")

          supp_path = Path("paper/source/supplementary.tex")
          supp = supp_path.read_text(encoding="utf-8")

          supp = replace_exact(supp, r'''comparison and nested weak-party scaling; Q2 is addressed by MovieLens; Q3--Q4
by the mechanism and deployment-objective audits; and Q5 by the ACM Hard
five-seed alignment-reference study.''', r'''comparison and nested weak-party scaling; Q2 is addressed by MovieLens; Q3--Q4
by the HGB and MovieLens mechanism and deployment-objective audits; and Q5 by
the ACM Hard five-seed alignment-reference study.''', "supp evidence map")

          movie_insert_marker = r'''\paragraph{Five-party comparison.}
Table~\ref{tab:supp-movielens-summary} includes Best Single at zero'''
          movie_insert = r'''\begin{table*}[!t]
\centering
\scriptsize
\setlength{\tabcolsep}{3.2pt}
\caption{MovieLens same-state peer-exchange intervention over seeds 42--46.
Condition A is the exact best-validation \method{} state with $K=1$; condition C
holds the epoch, topology, participant set, reliability vector, prediction
snapshot, and active readout fixed and changes only $K=1\!\to\!0$. Deltas are
A--C in ROC-AUC; both local metrics have win/tie/loss 5/0/0 in every setting.}
\label{tab:supp-movielens-exchange}
\begin{tabular}{lrrrrrr}
\toprule
Setting & Active A & Active C & Active $\Delta$ & All-party local $\Delta$ & Connected local $\Delta$ & Local W/T/L \\
\midrule
Five-party & 0.751625 & 0.751462 & $+0.000163$ & $+0.005501$ & $+0.008456$ & 5/0/0 \\
15-party Main & 0.751627 & 0.751645 & $-0.000017$ & $+0.003849$ & $+0.009935$ & 5/0/0 \\
15-party Hard & 0.749831 & 0.749760 & $+0.000071$ & $+0.005281$ & $+0.013103$ & 5/0/0 \\
\bottomrule
