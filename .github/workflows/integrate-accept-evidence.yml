          supp = replace_exact(supp, prune_insert_marker, prune_insert, "supp pruning insertion")

          supp = replace_exact(supp, r'''For the ACM Hard alignment study, the primary paired comparison is
Reliability-Selected Project-and-Mean minus \method{}: $-8.50$ points with
