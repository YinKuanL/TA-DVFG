Table~\ref{tab:supp-scalability}.''', "supp scalability paragraph")

          prune_insert_marker = r'''\section{Selector Sanity Checks}'''
          prune_insert = r'''\begin{table*}[!t]
\centering
\scriptsize
\setlength{\tabcolsep}{3.3pt}
\caption{Top-$M$ prescreening audit on ACM Hard scalability caches. $\Delta$
