name: Integrate accept evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integrate-accept-evidence-20260710
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact source patch stored in branch workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/integrate-accept-evidence.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, '<accept-evidence-patch>', 'exec'))
          PY

      - name: Commit source changes and delete temporary integration files
        run: |
          set -euxo pipefail
          rm -f .github/workflows/integrate-accept-evidence.yml .integration-trigger .accept-evidence-push-trigger .accept-evidence-push-trigger-2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A paper/source/main.tex paper/source/supplementary.tex paper/source/ReproducibilityChecklist.tex .github/workflows/integrate-accept-evidence.yml .integration-trigger .accept-evidence-push-trigger .accept-evidence-push-trigger-2
          git commit -m "Integrate MovieLens mechanism and pruning evidence"
          git push origin HEAD:integrate-accept-evidence-20260710
