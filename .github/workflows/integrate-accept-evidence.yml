claim is instead the same-state local benefit in
Table~\ref{tab:supp-movielens-exchange}. The stress settings do not establish a
monotonic law over weak-party count; that question is tested separately by the
nested HGB scaling study.''', "supp MovieLens stress interpretation")

          supp = replace_exact(supp, r'''\paragraph{Party-count scalability.}
Table~\ref{tab:supp-scalability} shows that selected graphs remain near five
links from 5 to 30 parties, while candidate evaluations and topology-selection
time grow much faster. Sparse deployment therefore scales differently from the
current selector: exhaustive candidate scoring, rather than deployment
communication, is the principal bottleneck. A concrete mitigation is a
