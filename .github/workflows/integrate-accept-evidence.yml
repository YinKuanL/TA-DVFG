\end{table*}

The active-effect 95\% confidence intervals are
$[-0.000003,0.000329]$, $[-0.000068,0.000033]$, and
$[-0.000102,0.000243]$ for five-party, Main, and Hard, respectively. In contrast,
the all-party local intervals are $[0.003310,0.007693]$,
$[0.002924,0.004773]$, and $[0.003683,0.006879]$; the connected-party intervals
are $[0.006638,0.010275]$, $[0.008377,0.011492]$, and
$[0.010306,0.015900]$. Thus peer exchange has negligible active-readout effect
at the fixed state but consistently improves local predictions, with the largest
effect among parties that actually receive messages.

\begin{table*}[!t]
\centering
\scriptsize
\setlength{\tabcolsep}{4.0pt}
\caption{MovieLens-15 active-only selection boundary. Same-cardinality subset
methods use the participant count of the corresponding \method{} state, define
no peer edges, and use validation information only for selection. Communication
