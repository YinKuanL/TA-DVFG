Greedy-Subset-$q$ exceeds \method{} by 0.000789 AUC on Main and 0.000016 on
Hard while using 64.2\% and 62.5\% less communication, respectively.
Selection-only methods do not modify party-local predictions and therefore do
not receive a local-benefit claim. Together with
Table~\ref{tab:supp-movielens-exchange}, the MovieLens evidence reproduces the
HGB interface boundary: active-only deployment is largely selection, whereas
peer exchange directly changes party-local inference.

\paragraph{Five-party comparison.}
Table~\ref{tab:supp-movielens-summary} includes Best Single at zero'''
          supp = replace_exact(supp, movie_insert_marker, movie_insert, "supp MovieLens mechanism insertion")

          supp = replace_exact(supp, r'''\paragraph{Fifteen-party stress settings.}
These controlled settings support the narrower claim that sparse graph-level
selection is useful when many weak predictors are available. By themselves,
they do not establish a monotonic law over noisy-party count; that question is
tested separately by the nested HGB scaling study. The direct latent-alignment
study is likewise limited to ACM Hard and frozen local predictors and should
not be read as evidence that prediction-space collaboration universally
dominates every possible latent interface.''', r'''\paragraph{Fifteen-party stress settings.}
These controlled settings show sparse graph-level selection outperforming dense
and edge-local P2P communication when many weak predictors are available. The
