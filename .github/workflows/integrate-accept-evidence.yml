name: Integrate accept evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/integrate-accept-evidence.yml
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-compile-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply evidence integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing exact block: {label}")
              return text.replace(old, new, 1)

          main_path = Path("paper/source/main.tex")
          main = main_path.read_text(encoding="utf-8")

          main = replace_exact(main, r'''Across six controlled 15-party HGB-derived settings, \method{} outperforms Full
Mesh and matched sparse P2P controls with only 5--5.8 of 105 possible links.
The strongest centralized reference, Global Top-$k$, is numerically higher in
four settings and lower in two; with five seeds, paired tests do not resolve a
difference. This boundary is central: same-cardinality subset selection is
cheaper and slightly stronger for active-only readout, whereas sparse peer
exchange raises party-local accuracy by 1.85/2.67 points on ACM/DBLP Hard and
connected-party accuracy by 4.79/7.16 points. On MovieLens, \method{} reaches
0.7516 AUC with 3.20M transmitted scalars, versus 0.7497 and 10.00M for Full
Mesh. Thus, learned topology is not claimed to be necessary for one centralized
aggregate; its distinct role is party-local or joint deployment. \method{} is
an inference-stage collaboration mechanism rather than a formal privacy
mechanism or a fully serverless, end-to-end VFGL protocol.''', r'''Across six controlled 15-party HGB-derived settings, \method{} outperforms Full
Mesh and matched sparse P2P controls with only 5--5.8 of 105 possible links.
The strongest centralized reference, Global Top-$k$, is numerically higher in
four settings and lower in two; with five seeds, paired tests do not resolve a
difference. On the audited Hard settings, same-cardinality subset selection is
cheaper and slightly stronger for active-only readout, whereas sparse peer
exchange raises party-local accuracy by 1.85/2.67 points and connected-party
accuracy by 4.79/7.16 points. The same boundary holds on MovieLens: disabling
only peer exchange changes active AUC by at most 0.00016 but lowers
connected-party mean AUC by 0.0085--0.0131. \method{} also reaches 0.7516 AUC
with 3.20M transmitted scalars, versus 0.7497/10.00M for Full Mesh. Thus,
learned topology is not claimed to be necessary for one centralized aggregate;
its distinct role is party-local or joint deployment. \method{} is an
inference-stage collaboration mechanism rather than a formal privacy mechanism
or a fully serverless, end-to-end VFGL protocol.''', "main abstract")

          main = replace_exact(main, r'''A common output space does not, however, make unrestricted exchange desirable.
Predictors differ in reliability and complementarity, so Full Mesh
communication can propagate weak predictions while incurring unnecessary cost.
Moreover, deployment may require an active-party readout, party-local
predictions, or a trade-off between them. Direct subset selection can suffice
for active-only readout, whereas party-local improvement requires useful peer
communication. For example, a hospital consortium may need both a registry-level aggregate
score and improved local predictions without exporting hidden states or routing
every inference through a permanent center. Similar dual-output requirements can
arise in multi-bank fraud screening. The problem is therefore to learn a sparse
graph whose utility is judged by deployment performance.''', r'''A common output space does not make unrestricted exchange desirable: weak
predictions can propagate while Full Mesh incurs unnecessary cost. Deployment
may also require one active readout, party-local predictions, or both. Direct
subset selection can suffice for active-only readout, whereas local improvement
requires useful peer communication. Hospital consortia or multi-bank fraud
systems illustrate such dual-output deployment. We therefore learn a sparse
graph whose utility is judged by deployment performance.''', "main introduction motivation")

          main = replace_exact(main, r'''We propose \method{}, a validation-assisted sparse topology learner for trained
heterogeneous predictors. A label-holding active party uses held-out validation
predictions to estimate predictor reliability and evaluates each feasible
one-edge extension only after rerunning consensus over the entire tentative
graph. Beneficial links are greedily retained under edge-budget and degree
constraints. At inference time, parties exchange class distributions only
along the selected links and perform reliability-aware consensus. The topology
can be optimized for active-party, party-local, or joint deployment objectives,
and may leave weak predictors isolated when connecting them is not beneficial.
Topology selection is centralized, whereas deployment communication is
peer-to-peer over the learned graph.''', r'''We propose \method{}, a validation-assisted sparse topology learner for trained
heterogeneous predictors. A label-holding active party estimates reliability
from held-out predictions and evaluates each feasible edge only after rerunning
consensus on the tentative graph. Beneficial links are greedily retained under
budget and degree constraints. At inference, parties exchange class
distributions only along selected links. The graph can target active, local, or
joint objectives and may isolate weak predictors. Selection is centralized;
deployment communication is peer-to-peer.''', "main method overview")

          main = replace_exact(main, r'''\item We evaluate the method across controlled HGB and heterogeneous
MovieLens settings, covering communication, label ownership, scalability,
deployment objectives, and a five-seed frozen-predictor latent-alignment study.''', r'''\item We evaluate the method across controlled HGB and heterogeneous
MovieLens settings, including cross-benchmark mechanism, deployment,
scalability, and a five-seed frozen-predictor latent-alignment study.''', "main contribution 4")

          main = replace_exact(main, r'''Table~\ref{tab:positioning} highlights the intended gap. Prediction-level
compatibility removes the need for a shared latent interface, but does not by
itself define peer communication paths or optimize party-local post-consensus
states. Centralized latent fusion provides a stronger-information interface when
genuine hidden states can be collected and projected, but does not produce a
sparse peer-to-peer deployment graph. \method{} instead makes this graph the
object of collaboration.''', r'''Existing work separately studies heterogeneous output interfaces, predictor
selection, and adaptive communication graphs. Table~\ref{tab:positioning}
highlights their intersection: prediction-level compatibility removes the need
for a shared latent interface, while \method{} additionally learns peer paths
and can optimize party-local post-consensus states. Centralized latent fusion
provides a stronger-information interface when genuine hidden states can be
collected and projected, but does not produce a sparse P2P deployment graph.''', "related-work synthesis")

          main = replace_exact(main, r'''Our evaluation addresses five questions.
\textbf{Q1: Sparse topology.}
Does learned sparsity improve over dense, fixed matched-sparse, and
no-collaboration references?
\textbf{Q2: Heterogeneity.}
Does the approach transfer to real-data heterogeneous predictor interfaces?
\textbf{Q3: Mechanism.}
What does graph structure provide beyond direct participant selection and
pairwise adaptation?
\textbf{Q4: Deployment.}
Do different readout objectives prefer different topologies?
\textbf{Q5: Interface assumption.}
When genuine hidden states are available to a centralized fusion module, how
does sparse prediction-topology learning compare with reliability-selected
latent alignment?''', r'''Our evaluation asks: \textbf{Q1}, whether learned sparsity improves over dense,
matched-sparse, and local references; \textbf{Q2}, whether it transfers to
heterogeneous real-data predictors; \textbf{Q3}, what graphs add beyond
selection and pairwise adaptation; \textbf{Q4}, how deployment objectives
change topology; and \textbf{Q5}, how prediction-space topology compares with
reliability-selected latent alignment.''', "evaluation questions")

          main = replace_exact(main, r'''\paragraph{MovieLens real-data heterogeneous predictor evaluation.}
The five parties span interaction, profile, temporal, metadata, and genre views
using MF, MLP, and KNN+MLP predictors with parameter counts
651,970/130,402/162/825,218/297,938.
Figure~\ref{fig:movielens-evidence} shows standalone predictor variation and
the AUC--communication trade-off. Best Single reaches 0.7402 AUC with zero communication; seed-level deltas
appear in the supplement.

Table~\ref{tab:movielens-main} shows that \method{} reaches 0.7516 ROC-AUC with 3.20M communication,
compared with 0.7497/10.00M for Full Mesh and 0.7510/5.20M for Adaptive
Pairwise. Because the absolute AUC differences are small, the main five-party result is one of Pareto efficiency rather than a large predictive gain:
\method{} uses 68.0\% less communication than Full Mesh and 38.5\% less than
Adaptive Pairwise. In the controlled 15-party Main and Hard stress settings,
\method{} reaches 0.7516/0.7498 AUC with 5.2/5.0 links, outperforming 105-link
Full Mesh and Adaptive Pairwise with roughly 14 links. When many weak predictors
are present, selective graph construction therefore provides both sparsity and
a predictive benefit.

\paragraph{Cross-benchmark interpretation.}
In MovieLens-5, topology learning mainly improves Pareto efficiency, whereas
under weak-predictor stress it also improves robustness by filtering harmful
communication.''', r'''\paragraph{MovieLens real-data heterogeneous predictor evaluation.}
Five parties use interaction, profile, temporal, metadata, and genre views with
MF, MLP, and KNN+MLP predictors. Figure~\ref{fig:movielens-evidence} shows
standalone variation and the AUC--communication trade-off. Best Single reaches
0.7402 AUC with zero communication; paired seed-level deltas are included in the
submitted package.

\method{} reaches 0.7516 ROC-AUC with 3.20M communication, compared with
0.7497/10.00M for Full Mesh and 0.7510/5.20M for Adaptive Pairwise. Because the
AUC margins are small, the five-party result is Pareto efficiency rather than a
large predictive gain: communication is 68.0\% below Full Mesh and 38.5\% below
Adaptive Pairwise. In the 15-party Main/Hard stress settings, \method{} reaches
0.7516/0.7498 AUC with 5.2/5.0 links versus 105 for Full Mesh and roughly 14 for
Adaptive Pairwise.

\paragraph{Real-data mechanism boundary.}
Same-state audits reproduce the HGB boundary on MovieLens. Across the five-party
and 15-party Main/Hard settings, disabling only peer exchange changes active AUC
by at most 0.00016, but lowers all-party local mean AUC by 0.0038--0.0055 and
connected-party mean AUC by 0.0085--0.0131; every local comparison is 5/0/0 in
win/tie/loss. On MovieLens-15, Greedy-Subset-$q$ matches or exceeds \method{}'s
active AUC while using 62--64\% less communication. Thus the mechanism audit
separates active-only participant selection from party-local peer exchange.''', "main MovieLens integration")

          main = replace_exact(main, r'''From 5 to 30 parties, candidate evaluations rise from 617 to 41,542 and
topology time from 0.81 to 81.46 seconds while selected graphs stay near five
links, confirming exhaustive scoring as the current bottleneck. Minimum-link
and edge-budget sweeps show that nonempty sparse collaboration emerges without
a minimum quota: with $m=0$, every ACM/DBLP Hard seed selects a nonempty graph
(2.6/3.0 edges on average), with DBLP unchanged and ACM higher in this sweep;
beyond any minimum quota, $B$ remains an upper bound; full results appear in
the supplement.''', r'''From 5 to 30 parties, exhaustive candidate evaluations rise from 617 to
41,542, confirming selection as the scalability bottleneck. We therefore test
two-stage screening with the existing pairwise utility as a cheap pre-ranking
signal. At 20/30 parties, supported top-20/top-40 shortlists reduce evaluations
by 88.8/90.5\% and yield $5.2\times$/$8.5\times$ speedups while staying within
0.10/0.23 percentage points of exhaustive accuracy; effective shortlist size
remains setting-dependent. Minimum-link and edge-budget sweeps show that
nonempty sparse collaboration emerges without a minimum quota: with $m=0$,
every ACM/DBLP Hard seed selects a nonempty graph (2.6/3.0 edges on average);
beyond any minimum quota, $B$ remains an upper bound. Full results appear in
the supplement.''', "main scalability result")

          main = replace_exact(main, r'''Global Top-$k$ and same-cardinality subset selection are strong centralized
choices for active-only deployment. \method{} is most justified when deployment
also requires party-local predictions, because its sparse links materially
improve connected parties.''', r'''Global Top-$k$ and same-cardinality subset selection are strong centralized
choices for active-only deployment. \method{} is most justified when deployment
also requires party-local predictions: same-state peer exchange materially
improves connected parties on both HGB and MovieLens.''', "discussion cross-benchmark")

          main = replace_exact(main, r'''Sparse deployment communication scales with the selected edge set, but
exhaustive candidate scoring remains the current scalability bottleneck. A
