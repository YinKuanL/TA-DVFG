name: Apply Claude review revision

on:
  push:
    branches:
      - claude-review-revision-20260710
    paths:
      - scripts/apply_claude_review_revision.py
      - .github/workflows/apply-claude-review-revision.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-revision:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude-review-revision-20260710
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix literal regex replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_claude_review_revision.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('re.subn(pattern, repl, text, count=1, flags=flags)', 're.subn(pattern, lambda _m: repl, text, count=1, flags=flags)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply review revision
        run: python scripts/apply_claude_review_revision.py
      - name: Validate expected revisions
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('paper/source/main.tex').read_text(encoding='utf-8')
          supp = Path('paper/source/supplementary.tex').read_text(encoding='utf-8')
          check = Path('paper/source/ReproducibilityChecklist.tex').read_text(encoding='utf-8')
          bib = Path('paper/source/references.bib').read_text(encoding='utf-8')
          assert 'numerically higher in four settings and lower in two' in main
          assert 'tab:active-only-boundary' in main
          assert 'utility stability' in main
          assert 'Why IMDB behaves differently' in supp
          assert 'wolpert1992stacked' in bib
          assert 'will be made publicly available' in check
          print('Expected paper revisions are present.')
          PY
      - name: Commit revised paper sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/source/main.tex paper/source/supplementary.tex paper/source/ReproducibilityChecklist.tex paper/source/references.bib
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Revise paper around active-only boundary and topology multiplicity"
            git push origin HEAD:claude-review-revision-20260710
          fi
