name: Apply Claude review revision

on:
  push:
    branches:
      - claude-review-revision-20260710
    paths:
      - scripts/apply_claude_review_revision.py
      - .github/workflows/apply-claude-review-revision.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-revision:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude-review-revision-20260710
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply review revision with captured diagnostics
        run: |
          set +e
          python scripts/apply_claude_review_revision.py > revision_stdout.txt 2> revision_error.txt
          code=$?
          echo "$code" > revision_exit.txt
          exit 0
      - name: Commit diagnostics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision_stdout.txt revision_error.txt revision_exit.txt
          git commit -m "Capture review revision diagnostics" || true
          git push origin HEAD:claude-review-revision-20260710
